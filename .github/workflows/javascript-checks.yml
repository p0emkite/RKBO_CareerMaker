name: JavaScript smoke checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check app.js
          node --check player-filter.js
          node --check roster.js
          node --check champions.js
          node --check github-db.js
          node --check card-renderer.js
          node --check rkbo-xls.js
          node tests/import.test.cjs
          node tests/player-filter.test.cjs
          node tests/github-db.test.cjs
          node tests/ui-layout.test.cjs
          node tests/roster-champions.test.cjs
          node tests/header-logo.test.cjs
          node tests/career-design.test.cjs
